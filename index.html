/* --- HỆ BIẾN MÀU & PHÔNG CHỮ (XANH DƯƠNG PASTEL) --- */
:root {
  --bg: #f0f7ff;
  --panel: #ffffff;
  --accent: #0284c7;
  --accent-light: #e0f2fe;
  --accent-border: #bae6fd;
  --ink: #0f172a;
  --muted: #64748b;
  --font-title: 'Baloo 2', system-ui, sans-serif;
  --font-body: 'Quicksand', system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  background-color: var(--bg);
  color: var(--ink);
  overflow-x: hidden;
  position: relative;
  line-height: 1.6;
}

canvas#wash {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  z-index: -2; pointer-events: none;
}
.fade-edge {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: radial-gradient(circle at center, transparent 40%, rgba(240,247,255,0.6) 100%);
  z-index: -1; pointer-events: none;
}

/* Floating Elements */
.drift-emoji {
  position: absolute; font-size: 24px; opacity: 0.6; pointer-events: none;
  animation: floatAround 8s ease-in-out infinite alternate;
}
@keyframes floatAround {
  0% { transform: translateY(0) rotate(0deg); }
  100% { transform: translateY(-20px) rotate(15deg); }
}

/* Header Bố cục mới - Trên cùng cố định */
header.top-nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255, 255, 255, 0.8);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--accent-border);
  padding: 0.8rem 2rem;
  display: flex; justify-content: space-between; align-items: center;
}
.nav-logo { font-family: var(--font-title); font-weight: 800; font-size: 1.5rem; color: var(--accent); }
.nav-links { display: flex; gap: 1.5rem; list-style: none; }
.nav-links a {
  text-decoration: none; color: var(--muted); font-weight: 600; font-size: 0.95rem;
  transition: all 0.3s ease; padding: 0.3rem 0.6rem; border-radius: 8px;
}
.nav-links a.active, .nav-links a:hover { color: var(--accent); background: var(--accent-light); }
.nav-drive {
  display: flex; align-items: center; justify-content: center;
  color: var(--accent); width: 40px; height: 40px; border-radius: 50%;
  background: var(--accent-light); transition: transform 0.3s ease;
}
.nav-drive:hover { transform: scale(1.1); }
.nav-drive svg { width: 20px; height: 20px; }

/* Main Content */
main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
section { padding: 4rem 0; scroll-margin-top: 80px; }

/* Hero Section */
.hero-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 3rem; align-items: center; }
