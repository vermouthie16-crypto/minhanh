<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nguyễn Minh Anh — Portfolio</title>

<style>
/* --- HỆ BIẾN MÀU & PHÔNG CHỮ (XANH DƯƠNG PASTEL) --- */
:root {
  --bg: #f0f7ff;
  --panel: #ffffff;
  --accent: #0284c7;
  --accent-light: #e0f2fe;
  --accent-border: #bae6fd;
  --ink: #0f172a;
  --muted: #64748b;
  --font-title: 'Baloo 2', system-ui, sans-serif;
  --font-body: 'Quicksand', system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  background-color: var(--bg);
  color: var(--ink);
  overflow-x: hidden;
  position: relative;
  line-height: 1.6;
}

canvas#wash {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  z-index: -2; pointer-events: none;
}
.fade-edge {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: radial-gradient(circle at center, transparent 40%, rgba(240,247,255,0.6) 100%);
  z-index: -1; pointer-events: none;
}

/* Floating Elements */
.drift-emoji {
  position: absolute; font-size: 24px; opacity: 0.6; pointer-events: none;
  animation: floatAround 8s ease-in-out infinite alternate;
}
@keyframes floatAround {
  0% { transform: translateY(0) rotate(0deg); }
  100% { transform: translateY(-20px) rotate(15deg); }
}

/* Header Bố cục mới - Trên cùng cố định */
header.top-nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255, 255, 255, 0.8);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--accent-border);
  padding: 0.8rem 2rem;
  display: flex; justify-content: space-between; align-items: center;
}
.nav-logo { font-family: var(--font-title); font-weight: 800; font-size: 1.5rem; color: var(--accent); }
.nav-links { display: flex; gap: 1.5rem; list-style: none; }
.nav-links a {
  text-decoration: none; color: var(--muted); font-weight: 600; font-size: 0.95rem;
  transition: all 0.3s ease; padding: 0.3rem 0.6rem; border-radius: 8px;
}
.nav-links a.active, .nav-links a:hover { color: var(--accent); background: var(--accent-light); }
.nav-drive {
  display: flex; align-items: center; justify-content: center;
  color: var(--accent); width: 40px; height: 40px; border-radius: 50%;
  background: var(--accent-light); transition: transform 0.3s ease;
}
.nav-drive:hover { transform: scale(1.1); }
.nav-drive svg { width: 20px; height: 20px; }

/* Main Content */
main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
section { padding: 4rem 0; scroll-margin-top: 80px; }

/* Hero Section */
.hero-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 3rem; align-items: center; }
.eyebrow { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); font-weight: 700; margin-bottom: 0.5rem; }
.name { font-family: var(--font-title); font-size: 3.5rem; line-height: 1.1; margin-bottom: 1rem; }
.name .accent { color: var(--accent); }
.hero-sub { color: var(--muted); font-size: 1.05rem; margin-bottom: 2rem; }
.hero-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem; }
.meta-item {
  background: var(--panel); padding: 1rem; border-radius: 12px;
  border: 1px solid var(--accent-border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
}
.meta-item .k { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; }
.meta-item .v { font-weight: 700; font-size: 0.95rem; color: var(--ink); margin-top: 0.2rem; }
.hero-actions { display: flex; gap: 1rem; }

/* Nút bấm hiệu ứng trồi lên mượt */
.btn { padding: 0.8rem 1.5rem; border-radius: 12px; font-weight: 600; text-decoration: none; transition: all 0.3s ease; display: inline-block; }
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: #0270a9; transform: translateY(-3px); box-shadow: 0 8px 15px rgba(2,132,199,0.3); }
.btn-ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.btn-ghost:hover { background: var(--accent-light); transform: translateY(-3px); }

/* --- KHUNG ẢNH ĐẠI DIỆN HÌNH VUÔNG BAY LƠ LỬNG --- */
.avatar-wrap { display: flex; justify-content: center; position: relative; }
.avatar-frame { 
  position: relative; 
  width: 280px; 
  height: 280px; 
  animation: floatAvatar 5s ease-in-out infinite alternate; /* Kích hoạt hiệu ứng tự động bay liên tục */
  transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.avatar-frame:hover { transform: scale(1.05) rotate(3deg); }

@keyframes floatAvatar {
  0% { transform: translateY(0px); filter: drop-shadow(0 12px 20px rgba(2, 132, 199, 0.15)); }
  100% { transform: translateY(-18px); filter: drop-shadow(0 25px 30px rgba(2, 132, 199, 0.25)); }
}

.avatar-blob {
  width: 100%; height: 100%; background: var(--panel); border-radius: 24px;
  overflow: hidden; display: flex; align-items: center; justify-content: center;
  border: 4px solid var(--accent-border); position: relative; z-index: 1;
}
.avatar-frame::before {
  content: ''; position: absolute; top: 10px; left: 10px; width: 100%; height: 100%;
  border: 2px dashed var(--accent); border-radius: 24px; z-index: -1; transition: transform 0.4s ease;
}
.avatar-frame:hover::before { transform: translate(-20px, -20px); }
.avatar-img { width: 100%; height: 100%; object-fit: cover; }
.avatar-fallback { font-family: var(--font-title); font-size: 4rem; font-weight: 800; color: var(--accent); }
.avatar-sticker {
  position: absolute; font-size: 2rem; background: white; width: 50px; height: 50px;
  display: flex; align-items: center; justify-content: center; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 2;
}
.avatar-sticker.s1 { top: -10px; left: -10px; }
.avatar-sticker.s2 { bottom: 10px; right: -10px; }

/* Section Headers */
.section-head { margin-bottom: 2.5rem; }
.tag { display: inline-block; background: var(--accent-light); color: var(--accent); padding: 0.2rem 0.8rem; border-radius: 20px; font-size: 0.8rem; font-weight: 700; margin-bottom: 0.5rem; }
.section-title { font-family: var(--font-title); font-size: 2rem; color: var(--ink); }

/* --- HIỆU ỨNG ĐỘNG CHO LƯỚI THÈ BÀI TẬP --- */
.ex-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(48%, 1fr)); gap: 1.5rem; }
.ex-card {
  background: var(--panel); border: 1px solid var(--accent-border); border-radius: 20px; padding: 1.7rem;
  box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); display: flex; flex-direction: column; justify-content: space-between;
  position: relative; overflow: hidden; transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), box-shadow 0.4s ease, border-color 0.4s ease;
}
.ex-card:hover { transform: translateY(-8px); border-color: var(--accent); box-shadow: 0 20px 30px -10px rgba(2, 132, 199, 0.2); }
.ex-card::after {
  content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
  background: linear-gradient(90deg, var(--accent-light), var(--accent), var(--accent-light));
  transform: scaleX(0); transition: transform 0.4s ease; transform-origin: left;
}
.ex-card:hover::after { transform: scaleX(1); }

.ex-top { display: flex; gap: 1rem; margin-bottom: 1rem; }
.ex-num {
  background: var(--accent-light); color: var(--accent); width: 36px; height: 36px;
  border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-family: var(--font-title); flex-shrink: 0;
}
.ex-title { font-family: var(--font-title); font-size: 1.2rem; font-weight: 700; color: var(--ink); }
.ex-body { font-size: 0.9rem
